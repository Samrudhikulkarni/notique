<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notique</title>
<link rel="icon" type="image/png" href="assets/notique-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="layout/sidebar.css">
<link rel="stylesheet" href="cards/card.css">
<link rel="stylesheet" href="calendar/calendar.css">
<link rel="stylesheet" href="shared/popup.css">
</head>
<body>
<div class="app">
  <div id="sidebarMount"></div>

  <section class="main">
    <div id="headerMount"></div>
    <div class="prog" id="prog"></div>
    <div class="d-flex flex-wrap gap-2 align-items-center my-3" id="filters"></div>
    <div id="viewBoard"><div id="board"></div></div>
    <div id="viewCal" class="hide"><div id="cal"></div></div>
  </section>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toast" class="toast" role="alert">
    <div class="toast-header"><i class="bi bi-bell-fill text-warning me-2"></i><strong class="me-auto">Reminder</strong><button class="btn-close" data-bs-dismiss="toast"></button></div>
    <div class="toast-body" id="toastBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="shared/popup.js"></script>

<script src="cards/card.js"></script>
<script src="modals/noteModal.js"></script>
<script src="modals/noteDetailsModal.js"></script>

<script src="js/dragdrop.js"></script>
<script src="calendar/calendar.js"></script>
<script src="layout/sidebar.js"></script>
<script src="layout/header.js"></script>
<script src="js/app.js"></script>
</body>
</html>
